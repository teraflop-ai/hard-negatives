[project]
name = "hard-negatives"
version = "0.1.4"
description = "Mine hard negatives from text datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "daft[ray]>=0.7.26",
    "datasets>=5.0.0",
    "flash-attn-3>=3.0.1",
    "psutil>=7.2.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flash-attn-3 = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
dev = [
    "gitingest>=0.3.1",
]
